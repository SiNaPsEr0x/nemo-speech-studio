name: NeMoStudio
options:
  bundleIdPrefix: io.github.sinapser0x
  deploymentTarget:
    iOS: "18.0"
packages:
  SpeechSwift:
    url: https://github.com/soniqo/speech-swift.git
    revision: 231f8eb9f0971fee335fef49f42d2975e4fbf8bc
  LlamaRuntime:
    path: Packages/LlamaRuntime
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.4
settings:
  base:
    # Swift 6 language mode; the stable Xcode 26.6 toolchain compiles with Swift 6.3.
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    MARKETING_VERSION: "2026.39.4"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NeMoStudio:
    type: application
    platform: iOS
    info:
      path: NeMoStudio/Info.plist
      properties:
        CFBundleDisplayName: NeMo Studio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryAddUsageDescription: "NeMo Studio salva nel rullino i video che scegli di esportare."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    sources:
      - path: NeMoStudio
    dependencies:
      - package: SpeechSwift
        product: AudioCommon
      - package: SpeechSwift
        product: NemotronStreamingASR
      - package: SpeechSwift
        product: SpeechVAD
      - package: SpeechSwift
        product: MagpieTTS
      - package: MLXSwift
        product: MLX
      - package: LlamaRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinapser0x.nemostudio
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
