name: NeMoStudio
options:
  bundleIdPrefix: io.github.sinapser0x
  deploymentTarget:
    iOS: "18.0"
packages:
  SpeechSwift:
    url: https://github.com/soniqo/speech-swift.git
    revision: 231f8eb9f0971fee335fef49f42d2975e4fbf8bc
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  NeMoStudio:
    type: application
    platform: iOS
    sources:
      - path: NeMoStudio
    dependencies:
      - package: SpeechSwift
        product: AudioCommon
      - package: SpeechSwift
        product: NemotronStreamingASR
      - package: SpeechSwift
        product: SpeechVAD
      - package: SpeechSwift
        product: MagpieTTS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinapser0x.nemostudio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NeMo Studio
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
