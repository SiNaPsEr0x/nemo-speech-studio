name: Build and publish NeMo Studio iOS

# La build e la Release partono solo su richiesta esplicita da Actions.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ios-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate settings property list
        run: plutil -lint iOS/NeMoStudio/Settings.bundle/Root.plist iOS/NeMoStudio/PrivacyInfo.xcprivacy
      - name: Generate Xcode project
        working-directory: iOS
        run: xcodegen generate
      - name: Resolve Swift packages and fix upstream Metal source
        working-directory: iOS
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project NeMoStudio.xcodeproj -scheme NeMoStudio \
            -derivedDataPath "$RUNNER_TEMP/nemo-derived" \
            2>&1 | tee "$RUNNER_TEMP/nemo-resolve.log"
          python3 Scripts/patch_mlx_steel.py "$RUNNER_TEMP/nemo-derived"
          if grep -nE 'warning:' "$RUNNER_TEMP/nemo-resolve.log"; then
            echo '::error::La risoluzione dei pacchetti ha prodotto warning.'
            exit 1
          fi
      - name: Compile for iPhone (unsigned)
        working-directory: iOS
        run: |
          set -o pipefail
          version="$(date -u +%G.%V.%u)"
          xcodebuild -project NeMoStudio.xcodeproj -scheme NeMoStudio \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/nemo-derived" \
            -skipPackagePluginValidation -skipMacroValidation \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/nemo-xcodebuild.log"
          if grep -nE 'warning:' "$RUNNER_TEMP/nemo-xcodebuild.log"; then
            echo '::error::La compilazione ha prodotto warning; correggerli prima di pubblicare.'
            exit 1
          fi
      - name: Remux sample MP4 and verify MKV video, audio, subtitle tracks
        working-directory: iOS
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null || brew install ffmpeg
          swiftc -swift-version 6 -framework AVFoundation \
            NeMoStudio/MatroskaMuxer.swift Scripts/verify_mkv.swift \
            -o "$RUNNER_TEMP/verify-mkv" 2>&1 | tee "$RUNNER_TEMP/nemo-smoke-swift.log"
          if grep -nE 'warning:' "$RUNNER_TEMP/nemo-smoke-swift.log"; then
            echo '::error::La verifica MKV ha prodotto warning Swift.'
            exit 1
          fi
          "$RUNNER_TEMP/verify-mkv" Tests/Fixtures/short.mp4 "$RUNNER_TEMP/short.mkv"
          ffprobe -v error -show_entries stream=codec_name,codec_type -of json \
            "$RUNNER_TEMP/short.mkv" > "$RUNNER_TEMP/mkv-streams.json"
          python3 - "$RUNNER_TEMP/mkv-streams.json" <<'PY'
          import json, sys
          streams = json.load(open(sys.argv[1]))['streams']
          assert len(streams) == 4, streams
          assert sorted((s['codec_type'], s['codec_name']) for s in streams) == [
              ('audio', 'aac'), ('subtitle', 'subrip'), ('subtitle', 'subrip'), ('video', 'h264')
          ], streams
          PY
          ffmpeg -v error -xerror -i "$RUNNER_TEMP/short.mkv" -map 0:v:0 -map 0:a:0 -f null -
      - name: Package and verify unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/nemo-ipa/Payload"
          ditto "$RUNNER_TEMP/nemo-derived/Build/Products/Release-iphoneos/NeMoStudio.app" \
            "$RUNNER_TEMP/nemo-ipa/Payload/NeMoStudio.app"
          cd "$RUNNER_TEMP/nemo-ipa"
          ditto -c -k --keepParent Payload "$RUNNER_TEMP/NeMoStudio-unsigned.ipa"
          test -s "$RUNNER_TEMP/NeMoStudio-unsigned.ipa"
          unzip -tq "$RUNNER_TEMP/NeMoStudio-unsigned.ipa"
          test -f "$RUNNER_TEMP/nemo-ipa/Payload/NeMoStudio.app/Info.plist"
          test -f "$RUNNER_TEMP/nemo-ipa/Payload/NeMoStudio.app/Assets.car"
          plutil -extract UILaunchScreen xml1 -o - "$RUNNER_TEMP/nemo-ipa/Payload/NeMoStudio.app/Info.plist" > /dev/null
          test "$(plutil -extract UIFileSharingEnabled raw -o - "$RUNNER_TEMP/nemo-ipa/Payload/NeMoStudio.app/Info.plist")" = true
          test "$(plutil -extract LSSupportsOpeningDocumentsInPlace raw -o - "$RUNNER_TEMP/nemo-ipa/Payload/NeMoStudio.app/Info.plist")" = true
      - name: Publish single iOS Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ios-current"
          version="$(date -u +%G.%V.%u)"
          asset="$RUNNER_TEMP/NeMoStudio-iOS-${version}-build${{ github.run_number }}-unsigned.ipa"
          cp "$RUNNER_TEMP/NeMoStudio-unsigned.ipa" "$asset"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          NeMo Studio per iOS: trascrizione locale Nemotron 3.5, identificazione parlanti Sortformer, traduzione Riva, sintesi Magpie, sottotitoli SRT/VTT/ASS, MKV con sottotitoli selezionabili per H.264/HEVC + AAC, MP4 impresso e MOV doppiato. Importazione da File e video dalla galleria Foto.

          L'IPA è senza firma: firmala con il tuo certificato prima di installarla su iPhone. Al primo avvio premi «Scarica / riprendi modelli»; i pesi non sono inclusi nell'IPA.

          I preset «Video + traccia» e «Tutto» sono attivi per video MP4/MOV con audio compatibile. «Tutto» esporta trascrizione, sottotitoli, MKV soft subtitle, MP4 con sottotitoli impressi, WAV doppiato e MOV con audio originale/doppiato; segnala un errore se manca un risultato richiesto. Compilazione e struttura IPA verificate in CI; inferenza dei modelli e riproduzione dei risultati richiedono una prova su iPhone reale. I container non decodificabili da AVFoundation non vengono elaborati. Per diagnosi attiva Debug nelle Impostazioni iOS e apri File → Sul mio iPhone → NeMo Studio → session.log.
          NOTES
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release view "$tag" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/old-assets.txt"
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title "NeMo Studio iOS $version · build ${{ github.run_number }}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest --target "$GITHUB_SHA"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
            while IFS= read -r old_asset; do
              if [ -n "$old_asset" ] && [ "$old_asset" != "$(basename "$asset")" ]; then
                gh release delete-asset "$tag" "$old_asset" --yes
              fi
            done < "$RUNNER_TEMP/old-assets.txt"
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" \
              --title "NeMo Studio iOS $version · build ${{ github.run_number }}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
          gh release view "$tag" --json url,assets --jq '{url: .url, files: [.assets[].name]}'
      - name: Remove merged iOS development branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch='codex/ios-port-foundation'
          pr_state="$(gh pr view 1 --json state --jq '.state')"
          expected_sha="$(gh pr view 1 --json headRefOid --jq '.headRefOid')"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" \
            --jq '.object.sha' 2>/dev/null || true)"
          if [ "$pr_state" = 'MERGED' ] && [ -n "$current_sha" ] && [ "$current_sha" = "$expected_sha" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          fi
